  /loyalty-admin/voucher-categories/{id}:
    get:
      tags:
        - Voucher Categories
      summary: Get Voucher Category by ID
      description: Retrieve a specific voucher category (requires read:voucher-categories permission)
      operationId: findOneVoucherCategory
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Voucher category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherCategory'

    put:
      tags:
        - Voucher Categories
      summary: Update Voucher Category
      description: Update a voucher category (requires update:voucher-categories permission)
      operationId: updateVoucherCategory
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoucherCategoryDto'
      responses:
        '200':
          description: Voucher category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherCategory'

    delete:
      tags:
        - Voucher Categories
      summary: Delete Voucher Category
      description: Delete a voucher category (requires delete:voucher-categories permission)
      operationId: removeVoucherCategory
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Voucher category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ============ QUESTS ============
  /loyalty-admin/quest:
    get:
      tags:
        - Quests
      summary: Get All Quests
      description: Retrieve all quests with pagination (requires read:quests permission)
      operationId: findAllQuests
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
