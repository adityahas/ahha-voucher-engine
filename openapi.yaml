      tags:
        - Reward Item Sources
      summary: Get Reward Item Source by ID
      description: Retrieve a specific reward item source
      operationId: findOneRewardItemSource
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
