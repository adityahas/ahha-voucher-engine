      operationId: updateRetailer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetailerDto'
      responses:
        '200':
          description: Retailer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retailer'

    delete:
      tags:
