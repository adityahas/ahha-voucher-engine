            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [ ASC, DESC ]
      responses:
        '200':
          description: Paginated list of quests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuestResponse'

    post:
      tags:
        - Quests
      summary: Create Quest
      description: Create a new quest (requires write:quests permission)
      operationId: createQuest
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestDto'
      responses:
        '201':
          description: Quest created successfully

  /loyalty-admin/quest/{id}:
    get:
      tags:
        - Quests
      summary: Get Quest by ID
      description: Retrieve a specific quest (requires read:quests permission)
      operationId: findOneQuest
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quest found

    patch:
      tags:
        - Quests
      summary: Update Quest
      description: Update a quest (requires write:quests permission)
      operationId: updateQuest
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestDto'
      responses:
        '200':
          description: Quest updated successfully

    delete:
      tags:
        - Quests
      summary: Delete Quest
      description: Delete a quest (requires write:quests permission)
      operationId: removeQuest
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Quest deleted successfully

  # ============ REWARD ITEMS ============
  /loyalty-admin/reward-item:
    get:
      tags:
        - Reward Items
      summary: Get All Reward Items
      description: Retrieve all reward items with pagination
