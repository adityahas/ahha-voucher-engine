            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [ ASC, DESC ]
      responses:
        '200':
          description: Paginated list of claimed vouchers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClaimedVoucherResponse'

  # ============ REWARD CLAIMS ============
  /rewards:
    get:
      tags:
        - Reward Claims
      summary: Get All Available Rewards
      description: Get all available rewards for claiming
      operationId: findAllRewards
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      responses:
        '200':
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RewardItem'

  /rewards/claim/{reward_id}:
    post:
      tags:
        - Reward Claims
      summary: Claim Reward
      description: Claim a reward item
      operationId: claimReward
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: reward_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reward claimed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '400':
          description: Reward out of stock or claim failed
        '404':
          description: Reward item not found

  # ============ PRODUCTS ============
  /redistro/products:
    get:
      tags:
        - Products
      summary: Get All Products
      description: Retrieve all products
      operationId: findAllProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
