      operationId: createRewardItem
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRewardItemDto'
      responses:
        '201':
          description: Reward item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardItem'

  /loyalty-admin/reward-item/{id}:
    get:
      tags:
        - Reward Items
      summary: Get Reward Item by ID
      description: Retrieve a specific reward item
      operationId: findOneRewardItem
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reward item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardItem'

    patch:
      tags:
        - Reward Items
      summary: Update Reward Item
      description: Update a reward item
      operationId: updateRewardItem
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRewardItemDto'
