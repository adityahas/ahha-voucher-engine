  # ============ LOYALTY CONSUMER ROOT ============
  /loyalty:
    get:
      tags:
        - Consumer Vouchers
      summary: Loyalty Consumer Root
      description: Root endpoint for loyalty consumer
      operationId: loyaltyConsumerRoot
      responses:
        '200':
          description: Success

  # ============ CONSUMER VOUCHERS ============
  /loyalty/vouchers:
    get:
      tags:
        - Consumer Vouchers
      summary: Get Eligible Vouchers
      description: Get vouchers eligible for the current user based on bindings
      operationId: getEligibleVouchers
