components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoints
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for the tenant

  schemas:
    # ============ BASE SCHEMAS ============
    BasePaginationDto:
      type: object
      properties:
        page:
          type: integer
          default: 0
          description: Page number (0-indexed)
        size:
          type: integer
          default: 10
          description: Items per page
        search:
          type: string
          default: ''
          description: Search query
        sort:
          type: string
          description: Field to sort by
        order:
          type: string
          enum: [ ASC, DESC ]
          description: Sort order

    BaseResponse:
      type: object
      properties:
        code:
          type: string
          description: Response code
        message:
          type: string
          description: Response message
        data:
          type: object
          description: Response data

    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                total:
                  type: integer
                size:
                  type: integer
            data:
              type: array
              items:
                type: object

    # ============ AUTH SCHEMAS ============
    LoginAdminDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Admin email address
        password:
          type: string
          format: password
          description: Admin password
      example:
        email: admin@example.com
        password: '********'

    LoginUserDto:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
      example:
        email: user@example.com
        password: '********'

    # ============ ADMIN SCHEMAS ============
    Role:
      type: string
      enum:
        - user
        - admin
        - sales
        - driver
      description: User role

    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        client:
          $ref: '#/components/schemas/Client'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CreateAdminDto:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: Admin name
        email:
          type: string
          format: email
          description: Admin email
        password:
          type: string
          format: password
          description: Admin password
        role:
          $ref: '#/components/schemas/Role'
          description: Admin role (defaults to 'admin')

    UpdateAdminDto:
      allOf:
        - $ref: '#/components/schemas/CreateAdminDto'

    # ============ CLIENT SCHEMAS ============
    Client:
      type: object
      properties:
        subdomain:
          type: string
          description: Unique subdomain for the client
        api_key:
          type: string
          description: API key for authentication
        database_name:
          type: string
          description: Client's database name
        database_username:
          type: string
          description: Database username (encrypted)
        database_password:
          type: string
          description: Database password (encrypted)
        database_port:
          type: string
        database_host:
          type: string

    # ============ USER SCHEMAS ============
    CreateUserDto:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        is_active:
          type: boolean
          description: Whether the user account is active

    UpdateUserDto:
      allOf:
        - $ref: '#/components/schemas/CreateUserDto'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ============ VOUCHER SCHEMAS ============
    VoucherBindingType:
      type: string
      enum:
        - role
        - product_type
        - product_sku
        - product_vendor
      description: Type of entity the voucher is bound to

    VoucherValidityType:
      type: string
      enum:
        - daily
        - birthday
        - weekly
        - monthly
        - one_time
      description: Type of voucher validity period

    VoucherCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Unique identifier for the category
        name:
          type: string
          description: Category name
        description:
          type: string
          description: Category description
        image:
          type: string
          description: Category image URL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVoucherCategoryDto:
      type: object
      required:
        - slug
        - name
        - description
        - image
      properties:
        slug:
          type: string
          description: Unique slug for the category
          example: food-and-beverage
          minLength: 1
          maxLength: 100
        name:
          type: string
          description: Category name
          example: Food & Beverage
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Category description
          example: Food and beverage vouchers for restaurants, cafes, and bars
          minLength: 1
          maxLength: 500
        image:
          type: string
          description: Image URL for the category
          example: https://example.com/images/food-beverage.png
          minLength: 1
          maxLength: 255

    UpdateVoucherCategoryDto:
      allOf:
        - $ref: '#/components/schemas/CreateVoucherCategoryDto'

    VoucherValidity:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/VoucherValidityType'
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
          nullable: true
        start_time:
          type: string
          example: '00:00:00'
        end_time:
          type: string
          example: '23:59:59'

    CreateVoucherValidityDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/VoucherValidityType'
        start_date:
          type: string
          format: date-time
          description: Start date in ISO 8601 format
        end_date:
          type: string
          format: date-time
          description: End date in ISO 8601 format
        start_time:
          type: string
          description: Start time (HH:MM:SS)
          example: '09:00:00'
        end_time:
          type: string
          description: End time (HH:MM:SS)
          example: '18:00:00'

    VoucherBinding:
      type: object
      properties:
        id:
          type: integer
        bind_type:
          type: string
          description: Type of binding
        bind_value:
          type: string
          description: Value of the binding

    CreateVoucherBindingDto:
      type: object
      required:
        - bind_type
        - bind_value
      properties:
        bind_type:
          $ref: '#/components/schemas/VoucherBindingType'
        bind_value:
          type: string
          description: Value to bind to (e.g., role name, product SKU)

    Voucher:
      type: object
      properties:
        code:
          type: string
          description: Unique voucher code (primary key)
        description:
          type: string
          description: Voucher description
        quota:
          type: integer
          description: Maximum number of times this voucher can be claimed
        image:
          type: string
          description: Voucher image URL
        categories:
          type: array
          items:
            $ref: '#/components/schemas/VoucherCategory'
        allow_combine_categories:
          type: array
          items:
            $ref: '#/components/schemas/VoucherCategory'
        validities:
          type: array
          items:
            $ref: '#/components/schemas/VoucherValidity'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/VoucherBinding'
        target_users:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of users allowed to use this voucher
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVoucherDto:
      type: object
      required:
        - code
        - quota
        - categories
        - allow_combine_categories
        - validities
        - bindings
      properties:
        code:
          type: string
          description: Unique voucher code
        description:
          type: string
          description: Voucher description
        quota:
          type: integer
          description: Maximum claim count
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateVoucherCategoryDto'
          description: Categories this voucher belongs to
        allow_combine_categories:
          type: array
          items:
            $ref: '#/components/schemas/CreateVoucherCategoryDto'
          description: Categories this voucher can be combined with
        validities:
          type: array
          items:
            $ref: '#/components/schemas/CreateVoucherValidityDto'
          description: Validity periods for this voucher
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/CreateVoucherBindingDto'
          description: Product/brand/store bindings
        target_users:
          type: array
          items:
            type: string
            format: uuid
          description: UUIDs of target users (optional)

    UpdateVoucherDto:
      allOf:
        - $ref: '#/components/schemas/CreateVoucherDto'

    PaginatedVoucherResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Voucher'

    PaginatedVoucherCategoryResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/VoucherCategory'

    # ============ CONSUMER VOUCHER SCHEMAS ============
    VoucherBindingDto:
      type: object
      required:
        - bind_type
        - bind_value
      properties:
        bind_type:
          $ref: '#/components/schemas/VoucherBindingType'
        bind_value:
          type: string
          description: Value to bind to

    GetEligibleVoucherDto:
      type: object
      required:
        - user_id
        - bindings
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID to check eligibility for
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/VoucherBindingDto'
          description: Binding criteria to filter vouchers

    VoucherResponseDto:
      type: object
      properties:
        code:
          type: string
          description: Voucher code
        description:
          type: string
          description: Voucher description
        image:
          type: string
          description: Voucher image URL

    ClaimedVoucher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        voucher:
          $ref: '#/components/schemas/VoucherResponseDto'
        claimed_at:
          type: string
          format: date-time

    GetClaimedVoucherResponseDto:
      type: object
      properties:
        voucher:
          $ref: '#/components/schemas/VoucherResponseDto'
        claimed_at:
          type: string
          format: date-time

    PaginatedClaimedVoucherResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GetClaimedVoucherResponseDto'

    # ============ QUEST SCHEMAS ============
    Quest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Quest name
        description:
          type: string
          description: Quest description
        reward_item_id:
          type: string
          format: uuid
          description: Associated reward item ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateQuestDto:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Quest name
        description:
          type: string
          description: Quest description
        reward_item_id:
          type: string
          format: uuid
          description: Associated reward item ID

    UpdateQuestDto:
      allOf:
        - $ref: '#/components/schemas/CreateQuestDto'

    PaginatedQuestResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Quest'

    # ============ REWARD ITEM SCHEMAS ============
    RewardItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Reward item name
        source_id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/RewardItemSource'
        type:
          type: string
          description: Reward type (e.g., 'gopay', 'pulsa')
        stock:
          type: integer
          description: Stock count (-1 = unlimited, 0 = out of stock)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRewardItemDto:
      type: object
      required:
        - name
        - source_id
        - type
      properties:
        name:
          type: string
          description: Reward item name
        description:
          type: string
          description: Reward item description
        source_id:
          type: string
          format: uuid
          description: Source ID
        type:
          type: string
          description: Reward type
        stock:
          type: integer
          default: -1
          description: Stock count (-1 = unlimited)

    UpdateRewardItemDto:
      allOf:
        - $ref: '#/components/schemas/CreateRewardItemDto'

    # ============ REWARD ITEM SOURCE SCHEMAS ============
    RewardItemSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Source name
        description:
          type: string
          description: Source description
        url:
          type: string
          format: uri
          description: Source URL
        source_type:
          type: string
          description: Type of source (e.g., 'gopay', 'bank_transfer')
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRewardItemSourceDto:
      type: object
      required:
        - name
        - source_type
      properties:
        name:
          type: string
          description: Source name
        description:
          type: string
          description: Source description
        url:
          type: string
          format: uri
          description: Source URL
        source_type:
          type: string
          description: Type of source

    UpdateRewardItemSourceDto:
      allOf:
        - $ref: '#/components/schemas/CreateRewardItemSourceDto'

    # ============ REWARD CLAIM SCHEMAS ============
    ClaimResult:
      type: object
      properties:
        status:
          type: string
          enum: [ SUCCESS, FAILED ]
          description: Claim status
        code:
          type: string
          description: Reward code (if successful)
        externalRefId:
          type: string
          description: External reference ID
        expiredAt:
          type: string
          format: date-time
          description: Expiration date (if applicable)
        errorMessage:
          type: string
          description: Error message (if failed)

    # ============ PRODUCT SCHEMAS ============
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
          description: Product price
        sku:
          type: string
          description: Product SKU
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProductDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Product name
        description:
          type: string
          description: Product description
        price:
          type: number
