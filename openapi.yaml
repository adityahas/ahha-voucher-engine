openapi: 3.0.3
info:
  title: Ahha Voucher Engine API
  description: |
    Multi-tenant SaaS backend for voucher distribution and redemption.

    ## Authentication

    This API uses two layers of authentication:
    1. **API Key** (`x-api-key` header) - Required for all requests
    2. **JWT Bearer Token** (`Authorization` header) - Required for admin endpoints

    ## Multi-Tenancy

    All requests must include the tenant subdomain in the Host header (e.g., `client1.ahha-be.local`).
    The subdomain determines which tenant database to use.
  version: 1.0.0
  contact:
    name: Ahha Team

servers:
  - url: http://{subdomain}.ahha-be.local
    variables:
      subdomain:
        default: client1
        description: Tenant subdomain

security:
  - ApiKeyAuth: [ ]
  - BearerAuth: [ ]
  - ApiKeyAuth: [ ]
    BearerAuth: [ ]

tags:
  - name: Authentication
    description: User and admin login endpoints
  - name: Admin Management
    description: Admin user CRUD operations
  - name: User Management
    description: End user management
  - name: Vouchers
    description: Voucher CRUD and management
  - name: Voucher Categories
    description: Voucher category management
  - name: Quests
    description: Quest/gamification management
  - name: Reward Items
    description: Reward item management
  - name: Reward Item Sources
    description: Reward item source configuration
  - name: Consumer Vouchers
    description: Consumer-facing voucher operations
  - name: Reward Claims
    description: Reward claiming for consumers
  - name: Products
    description: Product catalog management
  - name: Retailers
    description: Retailer management
  - name: Warehouses
    description: Warehouse management

paths:
  # ============ ADMIN AUTHENTICATION ============
  /admin/login:
    post:
      tags:
        - Authentication
      summary: Admin Login
      description: Authenticate an admin user and receive JWT token
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAdminDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  admin:
                    $ref: '#/components/schemas/Admin'
        '401':
          description: Invalid credentials

  # ============ ADMIN MANAGEMENT ============
  /admin:
    get:
      tags:
        - Admin Management
      summary: Get All Admins
      description: Retrieve all admin users (requires read:users permission)
      operationId: findAllAdmins
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      responses:
        '200':
          description: List of admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Admin'
        '403':
          description: Forbidden - insufficient permissions

    post:
      tags:
        - Admin Management
      summary: Create Admin
      description: Create a new admin user (requires write:users permission)
      operationId: createAdmin
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminDto'
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '403':
          description: Forbidden - insufficient permissions

  /admin/{id}:
    get:
      tags:
        - Admin Management
      summary: Get Admin by ID
      description: Retrieve a specific admin user
      operationId: findOneAdmin
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Admin found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '404':
          description: Admin not found

    patch:
      tags:
        - Admin Management
      summary: Update Admin
      description: Update an admin user
      operationId: updateAdmin
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminDto'
      responses:
        '200':
          description: Admin updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'

    delete:
      tags:
        - Admin Management
      summary: Delete Admin
      description: Delete an admin user
      operationId: removeAdmin
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Admin deleted successfully

  # ============ USER AUTHENTICATION ============
  /user/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticate an end user and receive JWT token
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserDto'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  # ============ USER MANAGEMENT ============
  /user-admin/users:
    get:
      tags:
        - User Management
      summary: Get All Users
      description: Retrieve all users (requires read:users permission)
      operationId: findAllUsers
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

    post:
      tags:
        - User Management
      summary: Create User
      description: Create a new user (requires write:users permission)
      operationId: createUser
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user-admin/users/{id}:
    get:
      tags:
        - User Management
      summary: Get User by ID
      description: Retrieve a specific user (requires read:users permission)
      operationId: findOneUser
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags:
        - User Management
      summary: Update User
      description: Update a user (requires write:users permission)
      operationId: updateUser
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ============ LOYALTY ADMIN ROOT ============
  /loyalty-admin:
    get:
      tags:
        - Vouchers
      summary: Loyalty Admin Root
      description: Root endpoint for loyalty admin
      operationId: loyaltyAdminRoot
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      responses:
        '200':
          description: Success

  # ============ VOUCHERS (Admin) ============
  /loyalty-admin/vouchers:
    get:
      tags:
        - Vouchers
      summary: Get All Vouchers
      description: Retrieve all vouchers with pagination (requires read:vouchers permission)
      operationId: findAllVouchers
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [ ASC, DESC ]
      responses:
        '200':
          description: Paginated list of vouchers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVoucherResponse'

    post:
      tags:
        - Vouchers
      summary: Create Voucher
      description: Create a new voucher (requires write:vouchers permission)
      operationId: createVoucher
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoucherDto'
      responses:
        '201':
          description: Voucher created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'

  /loyalty-admin/vouchers/{id}:
    get:
      tags:
        - Vouchers
      summary: Get Voucher by ID
      description: Retrieve a specific voucher (requires read:vouchers permission)
      operationId: findOneVoucher
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Voucher found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
        '404':
          description: Voucher not found

    patch:
      tags:
        - Vouchers
      summary: Update Voucher
      description: Update a voucher (requires write:vouchers permission)
      operationId: updateVoucher
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoucherDto'
      responses:
        '200':
          description: Voucher updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'

    delete:
      tags:
        - Vouchers
      summary: Delete Voucher
      description: Delete a voucher (requires write:vouchers permission)
      operationId: removeVoucher
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Voucher deleted successfully

