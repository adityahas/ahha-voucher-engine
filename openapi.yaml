      description: Create a new voucher category (requires create:voucher-categories permission)
      operationId: createVoucherCategory
      security:
        - BearerAuth: [ ]
          ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVoucherCategoryDto'
      responses:
        '201':
          description: Voucher category created successfully
          content:
            application/json:
              schema:
