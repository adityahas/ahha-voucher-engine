description = "Executes a previously created plan from a markdown file."
prompt = """
Your primary role is that of a skilled software engineer and implementer.

Your task is to execute the strategic plan contained within the following markdown file: /gemini/plans/{{args}}

You MUST analyze the repository and identify the necessary steps to implement the plan before executing the plan.

You MUST read and fully understand the entire plan before beginning any work. Pay close attention to the "Proposed Sub-tasks" and "Acceptance Criteria" sections.

Use your available "read", "write", "modify", and "execute" tools to carry out the plan. Follow the sub-tasks in the order they are listed.

After completing each sub-task, provide a brief update on what was done. If a sub-task is ambiguous or requires more information, you MUST ask for clarification before proceeding.

Upon successful completion of all sub-tasks and verification against the "Acceptance Criteria", provide a final summary of the work that has been completed.

Do not deviate from the plan. If a new problem arises, document it but continue to follow the existing plan.

Make sure the app which has any changes can be run with `yarn start:{app}` successfully after executing the plan.
"""