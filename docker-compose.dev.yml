services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-P4ssw0rd!}
      POSTGRES_DB: ${DB_NAME:-ahha_admin_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ahha_admin_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: yarn nest start admin --watch
    profiles: ['backend', 'admin', 'all']
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./package.json:/app/package.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    environment:
      NODE_ENV: development
      SERVICE_NAME: admin
      PORT_ADMIN: '9002'
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-P4ssw0rd!}
      DB_HOST: host.docker.internal
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-ahha_admin_db}
      DB_SYNC: ${DB_SYNC:-true}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: '6379'
      CLIENT_DB_SECRET: ${CLIENT_DB_SECRET:-9cc4da5ba5f1313590b00dabecdb4299}
      JWT_SECRET: ${JWT_SECRET:-zd8V9PjzqTks/gdScHwyhAVXAkIUyhWSrxBDBtVVlvE=}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - '9002:9002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

