name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review-trigger:
    name: Trigger Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect PR metadata
        id: pr
        run: |
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          echo "base=${{ github.base_ref }}" >> $GITHUB_OUTPUT
          echo "draft=${{ github.event.pull_request.draft }}" >> $GITHUB_OUTPUT
          echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT

      - name: Annotate review checklist
        uses: actions/github-script@v7
        with:
          script: |
            const checklists = {
              architecture: [
                'Database-per-tenant isolation maintained',
                'Middleware ordering preserved (SubdomainMiddleware → CredentialMiddleware)',
                'Path aliases used correctly (@core/auth, @core/database, etc.)',
                'Decimal(12,2) for monetary precision',
                'Transactional voucher usage when tied to purchase/order'
              ],
              code_quality: [
                'Format check passes: `yarn format:check`',
                'Lint passes: `yarn lint`',
                'Type check passes: `yarn type-check`',
                'No console.log or debug artifacts',
                'DTOs use proper validation decorators',
                'Repository pattern followed (DataSource from request context)',
              ],
              security: [
                'JWT guards on admin and consumer endpoints',
                'ACL permissions checked for admin operations',
                'AES encryption for sensitive data',
                'No secrets or credentials in code',
                'CORS properly configured',
              ],
              testing: [
                'New services/controllers have corresponding .spec.ts files',
                'E2E tests for critical paths (voucher claiming, purchase)',
                'Frontend changes have Vitest tests',
              ],
            };

            const body = `## PR Review: ${{ steps.pr.outputs.title }}

            **Author:** ${{ steps.pr.outputs.author }}
            **Branch:** \`${{ steps.pr.outputs.branch }}\` → \`${{ steps.pr.outputs.base }}\`
            **Draft:** ${{ steps.pr.outputs.draft }}

            CI workflow will automatically run the full test suite. Review the results below.

            ### Review Checklist

            #### :building_construction: Architecture
            ${checklists.architecture.map(item => `- [ ] ${item}`).join('\n')}

            #### :broom: Code Quality
            ${checklists.code_quality.map(item => `- [ ] ${item}`).join('\n')}

            #### :lock: Security
            ${checklists.security.map(item => `- [ ] ${item}`).join('\n')}

            #### :test_tube: Testing
            ${checklists.testing.map(item => `- [ ] ${item}`).join('\n')}
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Link CI run
        run: |
          echo "CI workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
