name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta-backend.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/ahha-backend
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (cms)
        id: meta-cms
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/ahha-frontend-cms
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push CMS frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cms
          push: true
          tags: ${{ steps.meta-cms.outputs.tags }}
          labels: ${{ steps.meta-cms.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (consumer)
        id: meta-consumer
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/ahha-frontend-consumer
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push consumer frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.consumer
          push: true
          tags: ${{ steps.meta-consumer.outputs.tags }}
          labels: ${{ steps.meta-consumer.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/ahha' }}
            echo "TAG=${{ needs.build-and-push.outputs.tag }}" > .env.tag
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.tag pull
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.tag up -d --remove-orphans
            docker system prune -f --filter "until=24h"
