name: Deploy to Staging

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ahha-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CMS image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cms
          push: false
          tags: ahha-cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Consumer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.consumer
          push: false
          tags: ahha-consumer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment status
        run: |
          echo "## :rocket: Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker images built successfully**" >> $GITHUB_STEP_SUMMARY
